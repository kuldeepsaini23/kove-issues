name: Feature request
description: An idea that would make Kove better
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or the moment it would help, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it elsewhere?
      description: Another terminal or tool that does this well (Warp, cmux, iTerm...).
